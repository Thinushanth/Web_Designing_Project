<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/Images/Logo/Bakery_Logo.png" />
    <link rel="stylesheet" href="/Register/Register.css" />
</head>

<body>
    <div class="container">

        <form>  
            <h1>Log In</h1>
            <div class="main-user-info">

                <div class="input-box">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="Enter your e-mail address" required>
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter atleast 8 charectors" required>
                </div>

                <div class="submitbtn">
                    <input type="submit" value="Log In" id="button" />
                </div>

                <div class="login">
                    <p>If you don't have an account <a href="/Register/Register.html" class="login-text">Create an account</a> here.</p>
                </div>

            </div>
        </form>
    </div>
</body>
</html>
