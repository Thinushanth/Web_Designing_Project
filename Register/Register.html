<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" href="/Images/Logo/Bakery_Logo.png" />
    <link rel="stylesheet" href="Register.css" />
</head>

<body>
    <div class="container">

        <form>  
            <h1>Register</h1>
            <div class="main-user-info">

                <div class="input-box">
                    <label for="UserName">User Name</label>
                    <input id="username" type="text" placeholder="Enter a user name" required>
                </div>
                <div class="input-box">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="Enter a valid e-mail address" required>
                </div>
                <div class="input-box">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter atleast 8 charectors" required>
                </div>
                <div class="input-box">
                    <label for="confirm">Confirm Password</label>
                    <input id="confirm" type="password" placeholder="Confirm Password" required>
                </div>
                <div class="submitbtn">
                    <input type="submit" value="Register" id="button" />
                </div>

                <div class="login">
                    <p>If you have an account <a href="/Login/Login.html" class="login-text">Log In</a> here.</p>
                </div>

            </div>
        </form>
    </div>
</body>

</html>
